        const formatTextWithHighlights = (text) => {
            if (!text) return null;
            const regex = /(\*\*.*?\*\*|==.*?==|__.*?__)/g;
            const parts = text.split(regex);
            
            return parts.map((part, i) => {
                if (part.startsWith('**') && part.endsWith('**')) return <span key={i} className="hl-red">{part.slice(2, -2)}</span>;
                if (part.startsWith('==') && part.endsWith('==')) return <span key={i} className="hl-yellow">{part.slice(2, -2)}</span>;
                if (part.startsWith('__') && part.endsWith('__')) return <span key={i} className="hl-blue">{part.slice(2, -2)}</span>;
                return <span key={i}>{part}</span>;
            });
        };

            const applyFormatToActiveElement = (prefix, suffix, defaultText = "Chữ nổi bật") => {
                const el = document.activeElement;
                if (el && el.tagName === 'TEXTAREA') {
                    const start = el.selectionStart;
                    const end = el.selectionEnd;
                    const val = el.value;
                    let selected = val.substring(start, end);
                    let insertedText = selected;
                    
                    if (!selected) insertedText = defaultText;

                    const newValue = val.substring(0, start) + prefix + insertedText + suffix + val.substring(end);
                    
                    const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, "value").set;
                    nativeInputValueSetter.call(el, newValue);
                    const event = new Event('input', { bubbles: true });
                    el.dispatchEvent(event);
                    
                    setTimeout(() => {
                        el.focus();
                        if (!selected) {
                            el.selectionStart = start + prefix.length;
                            el.selectionEnd = start + prefix.length + insertedText.length;
                        } else {
                            el.selectionStart = el.selectionEnd = start + prefix.length + insertedText.length + suffix.length;
                        }
                    }, 0);
                } else {
                    showToast('Hãy chạm (click) vào vị trí cần chèn trong ô soạn thảo trước nhé!', 'error');
                }
            };

            const handleTextareaKeyDown = (e, setter, currentValue) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const start = e.target.selectionStart;
                    const end = e.target.selectionEnd;
                    const textBefore = currentValue.substring(0, start);
                    const textAfter = currentValue.substring(end);
                    const lines = textBefore.split('\n');
                    const lastLine = lines[lines.length - 1];

                    let newText, newCursorPos;
                    if (lastLine.trim() === '•') {
                        lines.pop();
                        const newTextBefore = lines.join('\n') + (lines.length > 0 ? '\n' : '');
                        newText = newTextBefore + '\n' + textAfter;
                        newCursorPos = newTextBefore.length + 1; 
                    } else {
                        newText = textBefore + '\n• ' + textAfter;
                        newCursorPos = start + 3; 
                    }

                    const el = e.target;
                    const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, "value").set;
                    nativeInputValueSetter.call(el, newText);
                    const event = new Event('input', { bubbles: true });
                    el.dispatchEvent(event);
                    
                    setTimeout(() => { el.selectionStart = el.selectionEnd = newCursorPos; }, 0);
                }
            };

                if (!sheetId || sheetId.length < 15) {
                    showToast('Link hoặc ID Google Sheet không hợp lệ!', 'error'); return;

                    const response = await fetch(url);

                    const csvText = await response.text();
                    
                    if (csvText.toLowerCase().includes('<!doctype html>')) throw new Error('Not public');

                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ) : (
                                        <div className="mt-3">
                                            <label className="block text-xs font-semibold text-gray-600 mb-1 flex justify-between">Nội dung <span className="text-[10px] opacity-70">Ấn Enter để tự tạo Bullet (•)</span></label>
                                            <textarea value={content} onChange={(e) => setContent(e.target.value)} onKeyDown={(e) => handleTextareaKeyDown(e, setContent, content)} rows="6" placeholder="Nhập nội dung nhắc nhở..." className="w-full px-4 py-3 lg:px-3 lg:py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none transition-all resize-none shadow-sm text-base lg:text-sm"></textarea>
                                        </div>
                                    )}

                                    <div>
                                        <label className="block text-xs font-semibold text-gray-600 mb-1">Ký tên</label>
                                        <input type="text" value={signature} onChange={(e) => setSignature(e.target.value)} className="w-full px-4 py-3 lg:px-3 lg:py-2 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-400 focus:border-transparent outline-none transition-all shadow-sm text-base lg:text-sm" />
                                    </div>

                                    <div className="pt-3 flex justify-end">
                                        <button onClick={handleSaveRecord} className="w-full md:w-auto flex justify-center items-center gap-2 px-6 py-3 bg-gray-800 text-white hover:bg-gray-900 rounded-xl text-sm font-semibold shadow-md transition-all hover:shadow-lg">
                                            <i className="fa-solid fa-floppy-disk"></i> Lưu Phiếu
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* RIGHT COLUMN - PREVIEW */}
                        <div className={`flex-col gap-3 ${mobileTab === 'preview' ? 'flex' : 'hidden'} lg:flex`}>
                            <div className="flex flex-col sm:flex-row sm:items-center justify-between px-2 gap-3">
                                <span className="text-xs font-bold text-gray-600 uppercase tracking-wider flex items-center gap-1.5 hidden sm:flex">
                                    <i className="fa-solid fa-image"></i> Bản xem trước
                                </span>
                                <div className="flex gap-2 w-full justify-between sm:justify-end">
                                    <button onClick={handleShareZalo} disabled={isSharingZalo || isExportingImage} className="flex-1 sm:flex-none justify-center flex items-center gap-1.5 px-3 py-2.5 lg:px-3 lg:py-2 rounded-xl text-sm lg:text-xs font-bold transition-all text-white shadow-md bg-blue-500 hover:bg-blue-600 hover:shadow-lg hover:-translate-y-0.5">
                                        {isSharingZalo ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-share-nodes"></i>}
                                        Gửi Zalo
                                    </button>
                                    <button onClick={handleExportImage} disabled={isExportingImage || isSharingZalo} className="flex-1 sm:flex-none justify-center flex items-center gap-1.5 px-3 py-2.5 lg:px-3 lg:py-2 rounded-xl text-sm lg:text-xs font-bold transition-all text-white shadow-md bg-indigo-600 hover:bg-indigo-700 hover:shadow-lg hover:-translate-y-0.5">
                                        {isExportingImage ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-download"></i>}
                                        Tải Ảnh
                                    </button>
                                    <button onClick={handleExportPDF} disabled={isExportingPDF || isExportingImage} className="flex-1 sm:flex-none justify-center flex items-center gap-1.5 px-3 py-2.5 lg:px-3 lg:py-2 rounded-xl text-sm lg:text-xs font-bold transition-all text-white shadow-md bg-rose-600 hover:bg-rose-700 hover:shadow-lg hover:-translate-y-0.5">
                                        {isExportingPDF ? <i className="fa-solid fa-spinner fa-spin"></i> : <i className="fa-solid fa-file-pdf"></i>}
                                        Tải PDF
                                    </button>
                                </div>
                            </div>

                            <div id="preview-card" className={`relative overflow-hidden rounded-[1.5rem] shadow-xl border-4 border-white ${theme.card} transition-all duration-700 transform`}>
                                <div className={`${theme.headerBg} px-6 py-5 relative overflow-hidden`}>
                                    <div className="absolute -top-4 -right-4 text-5xl opacity-20 pointer-events-none select-none transition-transform duration-700 hover:scale-110 hover:rotate-12">{theme.decorIcon}</div>
                                    <div className="absolute -bottom-6 left-1/4 text-4xl opacity-20 pointer-events-none select-none">{theme.decorIcon}</div>
                                    
                                    <div className="relative z-10 flex justify-between items-start mb-4 font-semibold text-white/90 drop-shadow-sm">
                                        {schoolName && (
                                            <div className="flex items-center gap-1.5 bg-black/10 backdrop-blur-md px-2.5 py-1 rounded-lg text-xs">
                                                <i className="fa-solid fa-school"></i> {schoolName}
                                            </div>
                                        )}
                                        {className && (
                                            <div className="flex items-center gap-1.5 bg-white/20 backdrop-blur-md px-3 py-1 rounded-full text-xs border border-white/30 shadow-sm">
                                                <i className="fa-solid fa-users"></i> {className}
                                            </div>
                                        )}
                                    </div>

                                    <h2 className={`relative z-10 text-xl md:text-2xl font-extrabold ${theme.headerText} leading-tight drop-shadow-sm`}>
                                        {title || 'Tiêu đề thông báo...'}
                                    </h2>
                                    
                                    {currentTab === 'weekly' && weekPeriod && (
                                        <div className={`relative z-10 mt-3 inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-white/40 backdrop-blur-md shadow-sm ${theme.headerText} text-xs font-bold tracking-wide`}>
                                            <i className="fa-solid fa-calendar-days"></i> {weekPeriod}
                                        </div>
                                    )}
                                </div>

                                <div className="p-6 md:p-7">
                                    {currentTab === 'weekly' ? (
                                        <div className="relative">
                                            {currentLayout === 'timeline' && (
                                                <div className="absolute left-[7px] top-2 bottom-4 w-0.5 bg-indigo-100 z-0"></div>
                                            )}
                                            
                                            {!weekData.study && !weekData.activity && !weekData.discipline && !weekData.important && !weekData.rewards && !weekData.reminders && !weekData.parents && (
                                                <div className="text-center py-6 opacity-50 relative z-10">
                                                    <div className="text-3xl mb-2">{theme.decorIcon}</div><span className="italic text-sm">Nội dung tuần sẽ hiển thị ở đây...</span>
                                                </div>
                                            )}

                                            {renderRewardsReminders()}
                                            {renderMainSections()}
                                        </div>
                                    ) : (
                                        <div className={`whitespace-pre-wrap ${theme.text} text-sm md:text-[15px] leading-relaxed font-medium`}>
                                            {content || <div className="text-center py-6 opacity-50 italic text-sm">{theme.decorIcon} Nội dung thông báo sẽ hiển thị ở đây...</div>}
                                        </div>
                                    )}

                                    <div className={`mt-6 pt-4 border-t-2 border-dashed ${theme.border} text-right relative z-10`}>
                                        <p className={`text-lg font-extrabold ${theme.text} mb-0.5`}>{signature}</p>
                                        <p className={`text-[11px] font-semibold opacity-60 ${theme.text}`}>Giáo viên Chủ nhiệm</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>

                    <div className="lg:hidden fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-gray-200 p-3 pb-6 flex gap-3 z-50 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)]">
                        <button 
                            onClick={() => { setMobileTab('edit'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} 
                            className={`flex-1 py-3 rounded-2xl text-sm font-bold flex items-center justify-center gap-2 transition-all ${mobileTab === 'edit' ? 'bg-indigo-600 text-white shadow-md scale-[1.02]' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}
                        >
                            <i className="fa-solid fa-pen-to-square"></i> Soạn thảo
                        </button>
                        <button 
                            onClick={() => { setMobileTab('preview'); window.scrollTo({ top: 0, behavior: 'smooth' }); }} 
                            className={`flex-1 py-3 rounded-2xl text-sm font-bold flex items-center justify-center gap-2 transition-all ${mobileTab === 'preview' ? 'bg-indigo-600 text-white shadow-md scale-[1.02]' : 'bg-gray-100 text-gray-500 hover:bg-gray-200'}`}
                        >
                            <i className="fa-solid fa-image"></i> Xem trước & Tải
                        </button>
                    </div>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
